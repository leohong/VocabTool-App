name: Build and Release Android APK

# 觸發條件設定：
# 1. 只有當 push 的 Git Tag 符合 v* 格式時（如 v1.5.0），才會自動打包上傳，避免過度版頻繁打包。
# 2. 支援手動觸發 (workflow_dispatch)，可在 GitHub 網頁上手動點擊執行打包。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: 檢出專案程式碼
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: 設定 Node.js 環境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: 安裝 Node 依賴項目
      - name: Install Dependencies
        run: npm ci

      # Step 4: 執行前端模組預編譯打包至 www/index.html
      - name: Build Web Modules
        run: npm run build

      # Step 5: 設定 Java (JDK 21) 環境以便編譯 Android
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Step 6: 同步 Web 資源至 Android 原生工程 (Capacitor Sync)
      - name: Capacitor Sync Android
        run: npx cap sync android

      # Step 7: 快取 Gradle 依賴，加速未來編譯
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 8: 執行 Gradle 編譯 APK
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Step 9: 重新命名與定位 APK 檔案
      - name: Rename and Move APK
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/VocabTool-Latest.apk

      # Step 10: 自動建立 GitHub Release 並上傳 APK
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: output-apk/VocabTool-Latest.apk
          name: Release ${{ github.ref_name }}
          body: |
             ### 🧠 極限單字特訓系統 ${{ github.ref_name }} APK 發佈
             
             本版本已自動由 GitHub Actions 完成前端模組合併、Capacitor 同步與 Android 原生打包。
             
             #### 📥 安裝說明：
             - 下載下方 **`VocabTool-Latest.apk`** 檔案至您的 Android 手機。
             - 開啟安裝並允許「安裝未知來源應用程式」即可直接執行體驗！
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
